name: Deploy build log to GitHub Pages

# Human Gate (per docs/next-actions.md and the Workshop Gremlin's own policy):
# first Pages deploy is a human-confirmed action, not automatic. This workflow is
# defined but NOT wired to run on push yet - only workflow_dispatch, so merging
# this scaffold to main cannot itself trigger a live deploy. Once a human enables
# GitHub Pages in repo settings and runs workflow_dispatch once to confirm the
# site is ready to be public, add a `push: branches: [main]` trigger scoped to
# site/**, docs/build-log/**, and this file (see borrow-native's
# .github/workflows/deploy-pages.yml for the post-Human-Gate shape).
#
# Custom domain cutover (heartbeat.coderturtle.io, agentic-infra-lab's
# github-pages-dns pattern, onboarded as the sixth consumer) landed in this
# same commit, ahead of DNS actually going live - do NOT run workflow_dispatch
# until docs/next-actions.md's DNS/domain-verification/Pages-enablement steps
# are all confirmed done, or this deploy will publish a CNAME file GitHub
# can't yet resolve.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      # Custom domain: heartbeat.coderturtle.io, via agentic-infra-lab's
      # github-pages-dns pattern (Route53 CNAME + TXT verification).
      # site/public/CNAME declares the domain; Pages enablement and the
      # custom-domain setting are one-time, human-run `gh api` steps
      # (GITHUB_TOKEN cannot do either - see agentic-infra-lab's
      # interpreter-notes.md), not something this workflow does.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
