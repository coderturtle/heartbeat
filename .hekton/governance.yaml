governance_version: 1
project_name: heartbeat
created_date: 2026-08-29
owner: coderturtle
governance_level: G1
autonomy_level: 3

approval_policy:
  destructive_changes: human_required
  public_release: human_required
  production_changes: human_required
  credential_or_secret_changes: human_required
  financial_changes: human_required
  personal_data_changes: human_required
  dependency_changes: human_required

required_gates:
  preflight: true
  intent_recorded: true
  risk_review: true
  reproducibility_review: true
  validation_recorded: true
  end_session_review: true
  commit_hygiene_review: true

minimum_artifacts:
  project_metadata: ".hekton/project.yaml"
  governance: ".hekton/governance.yaml"
  risk_register: ".hekton/risk-register.yaml"
  change_log: ".hekton/change-log.yaml"
  review_log: ".hekton/review-log.yaml"
  agent_run_log: ".hekton/agent-run-log.yaml"
  session_log: "docs/session-log.md"
  decisions: "docs/decisions.md"
  risks: "docs/risks.md"

agent_defaults:
  safe_autonomy: true
  stop_for_human_approval_when_risk_is_high: true
  update_session_log_for_material_changes: true
  prefer_dry_run_before_mutation: true
  never_commit_secrets: true

# Coachgremlin Workflow step 0 (<hekton-machinery>/gremlins/coaching/coachgremlin.md):
# for a shared-throughline-project workshop, a later module's feature can silently
# change or break an earlier module's already-shipped exercise or rubric. Run
# scripts/arb-trigger-check.sh before starting work on any pending change to these
# files. Added 2026-08-30 (docs/completion-roadmap.md finding C) - this gate was
# missing even though Checkout makes heartbeat exactly the workshop shape it exists for.
arb_review_triggers:
  - pattern: "fixtures/checkout/src/rpc.rs"
    reason: "Checkout's RPC message shapes/exchange functions changed - a later module's feature could silently break Module 01's already-shipped exercise or rubric"
    review_type: governance
  - pattern: "fixtures/checkout/src/lib.rs"
    reason: "Checkout's crate-level module structure changed - every module README that cites a file path within it may now be stale"
    review_type: governance
