project_name: distributed-systems-workshop
project_title: "Distributed Systems Workshop"
classification: factory-output
status: active
lifecycle_stage: active
# local_repo_path and mind_palace_path are deliberately omitted: both encode this
# machine's filesystem layout and the vault taxonomy, and this repo is public-capable.
# They live in the private sibling's copy of this file.
owner: coderturtle
created_date: 2026-08-29
promotion_target: none
privacy_boundary: public
github_account: coderturtle
github_remote_url: "git@github.com-coderturtle:coderturtle/distributed-systems-workshop.git"
vault_mutation_allowed: false
# This repo is public-capable, so it is born without factory-internal artefacts.
# The canonical home for .hekton/agent-run-log.yaml, .hekton/change-log.yaml,
# .hekton/build-tasks/ and the mind-palace/ mirror is the private sibling below.
# Session machinery and governance validation read/write the sibling, not this repo.
private_sibling: distributed-systems-workshop-private
# version: applies to platform components (alpha|beta|v1.0|v1.x|v2.0) and factory outputs (v0|beta|v1.0|v1.x)
# Labs do not carry version numbers. Set by the Promotion Agent on first promotion; human confirms.
version: ""
default_agents:
  - claude
  - codex
related_projects: []

reproducibility:
  target: "blank Hekton machine"
  setup_mode: "scripted"
  bootstrap_script: "scripts/bootstrap-project.sh"
  prereq_script: "scripts/check-prereqs.sh"
  verify_script: "scripts/verify-project.sh"
  dry_run_supported: true
  destructive_actions_allowed: false
  env_file: ".env.example"
  local_assumptions_doc: "docs/local-assumptions.md"
  setup_doc: "docs/setup.md"
  reproducibility_doc: "docs/reproducibility.md"
  install_policy:
    prefer_homebrew: true
    prefer_documented_cli_commands: true
    avoid_opaque_installers: true
    require_manual_confirmation_for_unknown_installers: true

